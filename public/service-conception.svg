<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Plan technique d'une pièce avec cotes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#202226"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8102e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="minor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff4d5e"/>
    </marker>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#minor)"/>
  <rect width="800" height="800" fill="url(#major)"/>
  <circle cx="400" cy="400" r="330" fill="url(#glow)"/>

  <!-- Ejes de simetría -->
  <g stroke="#ff4d5e" stroke-width="1.4" stroke-dasharray="26 6 4 6" opacity="0.85">
    <line x1="150" y1="400" x2="650" y2="400"/>
    <line x1="400" y1="150" x2="400" y2="650"/>
  </g>

  <!-- Pieza: brida con 6 orificios -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4">
    <circle cx="400" cy="400" r="170"/>
    <circle cx="400" cy="400" r="150" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="400" cy="400" r="62"/>
    <circle cx="400" cy="400" r="84" stroke-opacity="0.45" stroke-width="1.4"/>
  </g>
  <circle cx="400" cy="400" r="118" fill="none" stroke="#ff4d5e" stroke-width="1.4" stroke-dasharray="14 6"/>
  <g fill="#0c0c0e" stroke="#ffffff" stroke-width="2.2">
    <circle cx="518" cy="400" r="15"/>
    <circle cx="459" cy="502.2" r="15"/>
    <circle cx="341" cy="502.2" r="15"/>
    <circle cx="282" cy="400" r="15"/>
    <circle cx="341" cy="297.8" r="15"/>
    <circle cx="459" cy="297.8" r="15"/>
  </g>

  <!-- Cota del diámetro exterior -->
  <g stroke="#ff4d5e" stroke-width="1.4" fill="none">
    <line x1="230" y1="585" x2="230" y2="640" stroke-opacity="0.7"/>
    <line x1="570" y1="585" x2="570" y2="640" stroke-opacity="0.7"/>
    <line x1="232" y1="628" x2="568" y2="628" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <rect x="352" y="613" width="96" height="30" fill="#0c0c0e"/>
  <text x="400" y="635" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#ffffff">Ø 340</text>

  <!-- Cota del orificio central con línea de referencia -->
  <g stroke="#ff4d5e" stroke-width="1.4" fill="none">
    <polyline points="437,365 520,250 590,250"/>
  </g>
  <text x="596" y="257" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#ffffff">Ø 124 H7</text>

  <!-- Cota de la circunferencia de pernos -->
  <g stroke="#ff4d5e" stroke-width="1.4" fill="none">
    <polyline points="330,455 250,540 190,540"/>
  </g>
  <text x="80" y="547" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#ffffff">6 × Ø 30</text>
  <text x="80" y="570" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#ffffff" fill-opacity="0.55">sur Ø 236</text>

  <!-- Cuadro de rotulación -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2">
    <rect x="505" y="690" width="240" height="68"/>
    <line x1="505" y1="724" x2="745" y2="724"/>
  </g>
  <text x="517" y="713" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#ffffff" fill-opacity="0.8">TEK-NIC · CONCEPTION</text>
  <text x="517" y="745" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#ff4d5e">CAO 3D · PLAN TECHNIQUE</text>
</svg>
